
name: Ecommerce CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runner:
    name: Verify Windows Runner
    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 10

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Check Python
        shell: powershell
        run: |
          python --version

      - name: Verify Streamlit service
        shell: powershell
        run: |
          Get-Service EcommerceStreamlit |
            Select-Object Name, Status

      - name: Verify deployment folder
        shell: powershell
        run: |
          $path = "C:\Deployments\Ecommerce-Sales-Analysis-and-Forecasting-System"

          if (!(Test-Path $path)) {
            throw "Deployment folder not found"
          }

          Write-Host "Deployment folder exists"


          
      - name: Test staging folder permissions
        shell: powershell
        run: |
          $staging = "C:\Deployments\Ecommerce-Staging"

          if (!(Test-Path $staging)) {
            throw "Staging folder not found"
          }

          $testFile = Join-Path $staging "runner-test.txt"

          "GitHub Actions staging test" |
            Set-Content -Path $testFile

          if (!(Test-Path $testFile)) {
            throw "Runner cannot write to staging folder"
          }

          Write-Host "SUCCESS: Runner can write to staging folder"

          Remove-Item $testFile -Force

