
      - name: Deploy to Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $source = $env:GITHUB_WORKSPACE
          $target = "C:\Deployments\Ecommerce-Sales-Analysis-and-Forecasting-System"

          robocopy $source $target /E /R:2 /W:2 /XD .git .github venv data output __pycache__ /XF *.pyc

          $copyExitCode = $LASTEXITCODE

          if ($copyExitCode -ge 8) {
            throw "Deployment copy failed with code $copyExitCode"
          }

          # Reset Robocopy's successful nonzero exit code
          $global:LASTEXITCODE = 0

          if (!(Test-Path "$target\dashboard\app.py")) {
            throw "Application file missing"
          }

          Write-Host "SUCCESS: Application code deployed!"
