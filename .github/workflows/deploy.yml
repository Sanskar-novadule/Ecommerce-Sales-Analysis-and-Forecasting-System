
name: Ecommerce CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $source = $env:GITHUB_WORKSPACE
          $target = "C:\Deployments\Ecommerce-Sales-Analysis-and-Forecasting-System"

          # Copy application code, preserving venv and local data
          robocopy $source $target /E /XD .git .github venv data output __pycache__ /XF *.pyc

          if ($LASTEXITCODE -ge 8) {
            throw "Deployment copy failed"
          }

          # Verify the deployed application
          if (!(Test-Path "$target\dashboard\app.py")) {
            throw "Application file missing"
          }

          Write-Host "Application code updated successfully"
